  --serif:'Cinzel','Trajan Pro',Georgia,serif;--sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg) url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%27520%27%20height%3D%27520%27%3E%3Cg%20fill%3D%27none%27%20stroke%3D%27%23cfc8b8%27%20stroke-opacity%3D%27.34%27%20stroke-width%3D%271%27%3E%3Cpath%20d%3D%27M-10%2090c60%2020%2090-30%20150%200s80%2070%20150%2050%20110-60%20240-20%27/%3E%3Cpath%20d%3D%27M40%20520c30-90-20-130%2030-200s120-40%20150-120%27/%3E%3Cpath%20d%3D%27M300%20540c-10-60%2050-90%2040-150s60-70%20190-60%27%20stroke-opacity%3D%27.2%27/%3E%3Cpath%20d%3D%27M150%2090c20%2040%200%2070%2030%20100%27%20stroke-opacity%3D%27.2%27/%3E%3C/g%3E%3C/svg%3E");background-size:520px;color:var(--ink);font:16px/1.45 var(--sans);padding-bottom:calc(74px + env(safe-area-inset-bottom))}
body.noscroll{overflow:hidden}
a{color:inherit;text-decoration:none}
h1,h2,h3,.brand{font-family:var(--serif);font-weight:600;letter-spacing:.04em;margin:0}
h1{font-size:26px;line-height:1.15}
h2{font-size:15px;color:var(--deep);margin:30px 0 10px;padding-bottom:7px;border-bottom:1px solid var(--line)}
h3{font-size:15px}
p{margin:0 0 10px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--patina);outline-offset:2px}
#top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 10px) 10px 14px;background:var(--bg);background-image:none;background-repeat:repeat-x;background-position:left bottom;background-size:16px 7px}
.brand{font-size:17px;letter-spacing:.22em;color:var(--deep);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:70vw}
#main{max-width:720px;margin:0 auto;padding:18px 16px 24px}
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:center;background:var(--marble);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
#tabs a{flex:1;max-width:130px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--stone);padding:5px 0;border-radius:6px}
#tabs a.on{color:var(--deep);font-weight:600}
#tabs a.on svg{stroke-width:2.1}
.sub{display:block;color:var(--stone);font-size:13px;line-height:1.35}
.lead{margin:6px 0 14px}
.quiet{color:var(--stone);padding:18px 0}
.center{text-align:center;margin-top:18px}
.headrow{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:12px}
.btn{border:1px solid var(--patina);background:transparent;color:var(--deep);padding:10px 16px;border-radius:3px;font-weight:600;font-size:14px;cursor:pointer;min-height:42px;display:inline-flex;align-items:center;justify-content:center}
.btn.solid{background:var(--deep);border-color:var(--deep);color:#f6f2e6}
.btn.sm{padding:5px 12px;min-height:34px;font-size:13px}
.btn.block{display:flex;width:100%;margin-top:18px}
.btn.danger{border-color:#c9a79f;color:var(--danger)}
.btn.danger.solid{background:var(--danger);border-color:var(--danger);color:#fff}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.ico{border:0;background:none;width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;color:var(--stone);cursor:pointer;border-radius:50%;flex:none}
.ico.back{color:var(--deep)}
.list{border-top:1px solid var(--line)}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 2px;border-bottom:1px solid var(--line)}
.row strong{display:block;font-weight:600}
.row>div:first-child{min-width:0}
.rt{display:flex;align-items:center;gap:10px;flex:none}
.num2{font-variant-numeric:tabular-nums;color:var(--stone);flex:none}
.wk{text-align:right;flex:none}
.dots{display:inline-flex;gap:3px;margin-bottom:4px}
.dots i{width:9px;height:9px;border:1px solid var(--stone);opacity:.45}
.dots i.on{background:var(--patina);border-color:var(--patina);opacity:1}
.invite{background:var(--marble);border:1px solid var(--line);padding:26px 20px;text-align:center}
.invite p{color:var(--stone);max-width:34ch;margin:0 auto 16px}
.titlein{width:100%;border:0;border-bottom:1px solid transparent;background:none;font-family:var(--serif);font-weight:600;font-size:24px;letter-spacing:.04em;padding:2px 0;border-radius:0}
.titlein:focus{border-bottom-color:var(--patina);outline:0}
.notes,.form input,.form select,.inline input,#pq{width:100%;background:var(--marble);border:1px solid var(--line);border-radius:3px;padding:10px 12px;font-size:16px}
.notes{resize:vertical;min-height:54px;font-style:italic}
.days{margin-top:20px}
.day{border-top:1px solid var(--line);padding:12px 0}
.day.today .dayhead strong{color:var(--patina)}
.dayhead{display:flex;justify-content:space-between;align-items:center}
.wo{display:block;background:var(--marble);border:1px solid var(--line);border-left:3px solid var(--patina);padding:11px 13px;margin-top:9px}
.note{display:block;color:var(--stone);font-size:13px;margin-top:4px}
.entry{background:var(--marble);border:1px solid var(--line);padding:13px 12px 12px;margin:16px 0}
.entry header{display:flex;justify-content:space-between;align-items:center}
.entry h3{font-size:16px;color:var(--deep)}
.last{font-size:13px;color:var(--stone);margin:2px 0 10px;font-style:italic}
.set{display:grid;grid-template-columns:34px 1fr 34px 30px;column-gap:6px;align-items:start;padding:8px 0 6px;border-top:1px solid var(--cream)}
.num{width:30px;height:30px;margin-top:5px;border-radius:50%;border:1.5px solid var(--line);background:none;font-family:var(--serif);font-size:13px;font-weight:600;color:var(--stone);cursor:pointer;padding:0}
.num.done{background:var(--patina);border-color:var(--patina);color:#fff}
.flds{display:flex;gap:8px}
.fld{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center}
.fld.wide{flex:1.5}
.fld input,.fld select{width:100%;text-align:center;border:0;border-bottom:1.5px solid var(--beige);background:none;padding:6px 2px;font-size:18px;font-variant-numeric:tabular-nums;border-radius:0;min-width:0}
.fld select{font-size:15px;padding:8px 2px;text-align-last:center}
.fld input:focus,.fld select:focus{border-bottom-color:var(--patina);outline:0}
.fld input::placeholder{color:#b9b09c}
.fld span{font-size:11px;color:var(--stone);margin-top:2px}
.set .ico{width:32px;height:38px}
.setnote{grid-column:2/5;display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin-top:4px}
.setnote input,.ennote{flex:1;min-width:120px;border:0;background:none;font-size:16px;font-style:italic;color:var(--ink);padding:4px 0;border-radius:0}
.setnote input::placeholder,.ennote::placeholder{color:#a79f8c}
.setnote input:focus,.ennote:focus{outline:0;box-shadow:0 1px 0 var(--patina)}
.tag,.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:2px;white-space:nowrap}
.tag{background:var(--cream);color:var(--deep);border:1px solid var(--beige)}
.pill{border:1px solid;flex:none}
.entryfoot{display:flex;align-items:center;gap:12px;border-top:1px solid var(--cream);padding-top:10px;margin-top:4px}
.plinth{text-align:center;background:var(--marble);border:1px solid var(--line);border-bottom:6px solid var(--beige);padding:26px 20px 22px}
.plinth h1{font-size:30px;letter-spacing:.14em;margin:6px 0 4px;color:var(--deep)}
.plinth.small h1{font-size:22px}
.plinth p{color:var(--stone);margin:0 auto 12px;max-width:36ch}
.bar{height:6px;background:var(--cream);max-width:240px;margin:14px auto 6px}
.bar i{display:block;height:100%;background:var(--patina)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.gm{background:var(--marble);border:1px solid var(--line);padding:12px 6px 10px;text-align:center;display:flex;flex-direction:column;align-items:center}
.gm strong{font-family:var(--serif);font-size:12.5px;letter-spacing:.05em;margin-top:4px}
.gm .sub{font-size:11.5px}
.seg{display:flex;border:1px solid var(--patina);margin:14px 0 6px}
.seg a{flex:1;text-align:center;padding:9px 2px;font-size:13px;font-weight:600;color:var(--deep)}
.seg a.on{background:var(--deep);color:#f6f2e6}
.chart{width:100%;height:auto;display:block}
.chart text,.radar text{font-size:10px;fill:var(--stone);font-family:var(--sans)}
.radar{width:100%;max-width:380px;display:block;margin:8px auto 0}
.spark{width:60px;height:20px}
.stats{display:flex;margin:18px 0 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.stats div{flex:1;padding:12px 0;text-align:center}
.stats div+div{border-left:1px solid var(--line)}
.stats dt{font-size:12px;color:var(--stone)}
.stats dd{margin:0;font-family:var(--serif);font-size:22px;font-weight:600}
.bars{display:flex;align-items:flex-end;gap:8px;height:150px;padding-top:18px}
.bars div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.bars i{display:block;width:100%;background:var(--patina);min-height:1px}
.bars b{font-size:11px;font-weight:600;color:var(--stone)}
.bars span{font-size:10px;color:var(--stone);margin-top:4px}
.hbars>div{display:grid;grid-template-columns:92px 1fr 34px;align-items:center;gap:8px;padding:5px 0;font-size:14px}
.track{height:10px;background:var(--cream)}
.track i{display:block;height:100%;background:var(--patina)}
.track i.low{background:#a9b8a3}
.hbars b{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.pair{margin:12px 0}
.pl{display:flex;justify-content:space-between;font-size:14px;font-weight:600;margin-bottom:5px}
.split{height:10px;background:var(--beige)}
.split i{display:block;height:100%;background:var(--patina);border-right:2px solid var(--bg)}
.exrank{display:flex;align-items:center;gap:12px;background:var(--marble);border:1px solid var(--line);padding:10px 14px;margin-bottom:14px}
.hist{display:block;padding:12px 0;border-bottom:1px solid var(--line)}
.hist span{display:block;font-variant-numeric:tabular-nums}
.hist i{color:var(--patina);font-style:normal;font-size:13px;font-weight:600}
.hist em{color:var(--stone)}
.hist>em{display:block;margin-top:3px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0}
.chips.scrollx{flex-wrap:nowrap;overflow-x:auto;padding:10px 0;margin:0;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--marble);padding:7px 12px;border-radius:2px;font-size:14px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.chip.static{cursor:default}
.chip.on{background:var(--deep);border-color:var(--deep);color:#f6f2e6}
.chip svg{width:12px;height:12px}
.form{display:grid;gap:12px;margin:12px 0}
.form label{font-size:13px;color:var(--stone);display:grid;gap:4px}
.inline{display:flex;gap:8px;margin:10px 0}
.inline input{min-width:0;flex:1}
#sheet{position:fixed;inset:0;z-index:20}
.scrim{position:absolute;inset:0;background:rgba(36,35,31,.45)}
.panel{position:absolute;left:0;right:0;bottom:0;max-height:88vh;overflow-y:auto;background:var(--bg);border-top:4px solid var(--beige);padding:20px 16px calc(20px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto;animation:up .18s ease-out}
.panel h2{margin-top:0;font-size:17px;border:0;padding:0}
.panel h3{font-size:12px;color:var(--stone);margin:14px 0 2px}
@keyframes up{from{transform:translateY(24px);opacity:0}}
@media (prefers-reduced-motion:reduce){.panel{animation:none}}
.pitem{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:11px 2px;cursor:pointer}
.pitem strong{display:block;font-weight:600}
#plist{min-height:50vh}
.menu button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:14px 2px;font-size:16px;cursor:pointer}
.dangertxt{color:var(--danger)}
.welcome{text-align:center}
.prose p{font-size:15px}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);background:var(--deep);color:#f6f2e6;padding:9px 16px;border-radius:3px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:30;white-space:nowrap}
#toast.on{opacity:1;transform:translateX(-50%)}
@media (min-width:760px){#main{padding-top:28px}.grid{grid-template-columns:repeat(4,1fr)}.panel{bottom:auto;top:8vh;border:1px solid var(--line);border-top:4px solid var(--beige)}}
#bwIn{flex:.55}

function medal(score,size=64){
  const i = score==null ? -1 : tierIndex(score), t = i<0 ? {c:'#b3ad9f',d:'#a59d8a',t:'#857d6c'} : TIERS[i];
  let leaves='';
  for(let k=0;k<9;k++){ const a=(104+k*17.5)*Math.PI/180, x=50+43*Math.cos(a), y=50+43*Math.sin(a), rot=104+k*17.5+90+24;
    leaves+=`<ellipse cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="7.4" ry="2.9" transform="rotate(${rot.toFixed(0)} ${x.toFixed(1)} ${y.toFixed(1)})"/>`; }
  const vein = i===5 ? `<path d="M26 40c9 3 13 12 22 13s15-8 26-5M34 66c8-5 16 1 24-3" fill="none" stroke="#b9b4a8" stroke-width="1"/>` : '';
  return `<svg class="medal" width="${size}" height="${size}" viewBox="0 0 100 100" aria-hidden="true"><g fill="${t.d}" opacity="${i<0?.6:1}">${leaves}<g transform="translate(100,0) scale(-1,1)">${leaves}</g></g>
<circle cx="50" cy="50" r="32" fill="url(#mat${i<0?'R':i})" filter="url(#embM)"/><circle cx="50" cy="50" r="32" fill="none" stroke="${t.d}" stroke-width="2"/>${vein}<circle cx="50" cy="50" r="26.500" fill="none" stroke="${t.d}" stroke-width=".9" opacity=".7"/>
<text x="50" y="58" text-anchor="middle" font-family="Cinzel,serif" font-weight="600" font-size="${i===6?19:22}" fill="${t.t}" ${i>=0&&i!==5&&i!==6?'style="paint-order:stroke" stroke="rgba(0,0,0,.25)" stroke-width=".6"':''}>${i<0?'':ROMAN[i]}</text></svg>`;
}

const mirror = d => { let i=0; return d.replace(/-?\d+(\.\d+)?/g,n=>(i++%2===0)?String(Math.round((200-n)*10)/10):n); };

const tierName = s => s==null ? 'Unranked' : TIERS[tierIndex(s)].n;
function pill(score){ if(score==null) return ''; const t=TIERS[tierIndex(score)]; return `<span class="pill" style="background:${t.c};color:${t.t};border-color:${t.d}">${t.n} ${Math.round(score)}</span>`; }
function setLabel(ex,s){
  const u=unit();
  if(ex.type==='h') return `${fmtN(s.t)} s`;
  if(ex.type==='s') return `${ex.stages[Math.min(s.st||0,ex.stages.length-1)].n}, ${ex.metric==='sec'?fmtN(s.t)+' s':fmtN(s.r)+' reps'}`;
  if(ex.type==='c') return `${fmtN(s.min)} min${s.dist?', '+fmtN(s.dist)+(u==='lb'?' mi':' km'):''}`;
  if(ex.type==='b') return s.w>0 ? `+${fmtN(s.w)} ${u} × ${fmtN(s.r)}` : `${fmtN(s.r)} reps`;
  return s.w>0 ? `${fmtN(s.w)} ${u} × ${fmtN(s.r)}` : `${fmtN(s.r)} reps`;
}
function lineChart(pts,{h=150,fmt=fmtN,color='var(--patina)',floor0=false}={}){
  if(!pts.length) return `<p class="quiet">Nothing logged yet.</p>`;
  const W=340,pl=36,pr=12,pt=12,pb=22, xs=pts.map(p=>D(p.x).getTime()), ys=pts.map(p=>p.y);
  let lo=Math.min(...ys), hi=Math.max(...ys); if(floor0) lo=0; if(hi-lo<1e-9){hi=lo+1; if(!floor0) lo=lo-1;} const pad=(hi-lo)*.08; hi+=pad; if(!floor0) lo-=pad;
  const x0=xs[0], x1=xs[xs.length-1], X=x=>x1===x0?(pl+(W-pl-pr)/2):pl+(x-x0)/(x1-x0)*(W-pl-pr), Y=y=>pt+(1-(y-lo)/(hi-lo))*(h-pt-pb);
  const path=pts.map((p,i)=>(i?'L':'M')+X(xs[i]).toFixed(1)+' '+Y(p.y).toFixed(1)).join('');
  const grid=[lo,(lo+hi)/2,hi].map(v=>`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${pl-6}" y="${Y(v)+4}" text-anchor="end">${fmt(v)}</text>`).join('');
  const last=pts[pts.length-1];
  return `<svg class="chart" viewBox="0 0 ${W} ${h}" role="img" aria-label="Line chart">${grid}
${pts.length>1?`<path d="${path}L${X(x1)} ${h-pb}L${X(x0)} ${h-pb}Z" fill="${color}" opacity=".09"/><path d="${path}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`:''}
${pts.length<=24?pts.map((p,i)=>`<circle cx="${X(xs[i])}" cy="${Y(p.y)}" r="2.6" fill="var(--marble)" stroke="${color}" stroke-width="1.6"/>`).join(''):''}
<circle cx="${X(x1)}" cy="${Y(last.y)}" r="4" fill="${color}"/>
<text x="${pl}" y="${h-5}">${fDate(pts[0].x)}</text>${pts.length>1?`<text x="${W-pr}" y="${h-5}" text-anchor="end">${fDate(last.x)}</text>`:''}</svg>`;
}
function spark(vals){ if(vals.length<2) return ''; const lo=Math.min(...vals),hi=Math.max(...vals),r=hi-lo||1;

const weekOf = id => S.weeks.find(w=>w.id===id);
const woOf = id => S.workouts.find(w=>w.id===id);
const weekWos = w => S.workouts.filter(x=>x.week===w.id).sort((a,b)=>a.date.localeCompare(b.date));
const doneSets = wo => wo.entries.reduce((n,en)=>n+en.sets.filter(s=>EXM[en.ex]&&isDone(EXM[en.ex],s)).length,0);
function lastPerf(exId,before,skip){
  let best=null; for(const wo of S.workouts){ if(wo.id===skip||wo.date>before) continue; const en=wo.entries.find(e=>e.ex===exId&&e.sets.some(s=>isDone(EXM[exId],s))); if(en&&(!best||wo.date>=best.wo.date)) best={wo,en}; }
  return best;
}
function blankSets(ex,src){
  if(src) return src.filter(s=>isDone(ex,s)||s.pr||s.pt||s.pw).map(s=>({pw:s.w??s.pw,pr:s.r??s.pr,pt:s.t??s.pt,st:s.st}));
  return [{}];
}
function newEntry(exId,date,skip){ const ex=EXM[exId], lp=lastPerf(exId,date,skip); const sets=lp?blankSets(ex,lp.en.sets):[{}]; return {id:uid(),ex:exId,sets:sets.length?sets:[{}]}; }
const cloneEntries = ents => ents.filter(e=>EXM[e.ex]).map(e=>{ const s=blankSets(EXM[e.ex],e.sets); return {id:uid(),ex:e.ex,sets:s.length?s:[{}]}; });
function ensureWeek(start){ let w=S.weeks.find(x=>x.start===start); if(!w){ w={id:uid(),start,name:'',note:''}; S.weeks.push(w);} return w; }
const weekTitle = w => w.name || `Week of ${fDate(w.start)}`;

function vLog(){
  const weeks=[...S.weeks].sort((a,b)=>b.start.localeCompare(a.start)), cur=mondayOf(today());
  const rows=weeks.map(w=>{ const wos=weekWos(w), days=new Set(wos.map(x=>x.date));
    const dots=[0,1,2,3,4,5,6].map(i=>`<i class="${days.has(addDays(w.start,i))?'on':''}"></i>`).join('');
    return `<a class="row" href="#/week/${w.id}"><div><strong>${esc(weekTitle(w))}</strong><span class="sub">${fDate(w.start)} to ${fDate(addDays(w.start,6))}${w.start===cur?', this week':''}</span></div>
      <div class="wk"><span class="dots">${dots}</span><span class="sub">${wos.length} workout${wos.length===1?'':'s'}, ${wos.reduce((n,x)=>n+doneSets(x),0)} sets</span></div></a>`; }).join('');
  return {title:'Kouros',tab:'log',html:`<div class="headrow"><h1>Training log</h1><button class="btn" data-act="newWeek">New week</button></div>
    ${weeks.length?`<div class="list">${rows}</div>`:`<div class="invite"><p>Your log is organized by week. Start one, then add each day's workout to it.</p><button class="btn solid" data-act="startThisWeek">Start this week</button></div>`}`};
}

function fld(d,f,val,ph,label){ return `<label class="fld"><input inputmode="decimal" autocomplete="off" ${d} data-f="${f}" value="${esc(val??'')}" placeholder="${esc(ph??'')}"><span>${label}</span></label>`; }
function setRow(wo,en,ex,s,i){
  const d=`data-wo="${wo.id}" data-en="${en.id}" data-si="${i}"`, u=unit(); let f='';
  if(ex.type==='w'||ex.type==='u') f=fld(d,'w',s.w,s.pw,u)+fld(d,'r',s.r,s.pr,'reps');
  else if(ex.type==='b') f=fld(d,'w',s.w,s.pw??'BW','+ '+u)+fld(d,'r',s.r,s.pr,'reps');
  else if(ex.type==='h') f=fld(d,'t',s.t,s.pt,'seconds');
  else if(ex.type==='s') f=`<label class="fld wide"><select ${d} data-f="st">${ex.stages.map((st,k)=>`<option value="${k}" ${k===(s.st||0)?'selected':''}>${esc(st.n)}</option>`).join('')}</select><span>stage</span></label>`+(ex.metric==='sec'?fld(d,'t',s.t,s.pt,'seconds'):fld(d,'r',s.r,s.pr,'reps'));
  else f=fld(d,'min',s.min,'','minutes')+fld(d,'dist',s.dist,'',u==='lb'?'miles':'km')+`<label class="fld wide"><select ${d} data-f="int">${['Effort','Easy','Moderate','Hard','All out'].map((n,k)=>`<option value="${k}" ${k===(s.int||0)?'selected':''}>${n}</option>`).join('')}</select><span>effort</span></label>`;
  const tags=(s.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('');
  return `<div class="set"><button class="num ${isDone(ex,s)?'done':''}" ${d} data-act="fillSet" aria-label="Set ${i+1}, tap to accept the suggested numbers">${i+1}</button><div class="flds">${f}</div>

    <div class="setnote">${tags}<input ${d} data-f="note" value="${esc(s.note||'')}" placeholder="Note on this set" aria-label="Note on set ${i+1}"></div></div>`;

function radar(g){
  const n=GROUPS.length, c=150, R=100, P=(i,v)=>{ const a=-Math.PI/2+i*2*Math.PI/n; return [(c+Math.cos(a)*R*v/100),(c+Math.sin(a)*R*v/100)]; };

  ${GROUPS.map((_,i)=>{const [x,y]=P(i,100);return `<line x1="${c}" y1="${c}" x2="${x}" y2="${y}" stroke="var(--line)"/>`;}).join('')}
  <polygon points="${GROUPS.map(([k],i)=>P(i,Math.max(g[k].score,2)).map(x=>x.toFixed(1)).join(',')).join(' ')}" fill="var(--patina)" fill-opacity=".18" stroke="var(--patina)" stroke-width="2" stroke-linejoin="round"/>

function vBalance(){

}

/* ---------- actions ---------- */
const findSet = d => { const wo=woOf(d.wo), en=wo&&wo.entries.find(e=>e.id===d.en); return en?{wo,en,set:en.sets[+d.si],ex:EXM[en.ex]}:{}; };
function convertUnits(to){
  const k=to==='kg'?1/2.20462:2.20462, c=v=>v>0?Math.round(v*k*2)/2:v;
  const fix=s=>{ if(s.w) s.w=c(s.w); if(s.pw) s.pw=c(s.pw); if(s.dist) s.dist=Math.round(s.dist*(to==='kg'?1.60934:1/1.60934)*100)/100; };
  S.workouts.forEach(w=>w.entries.forEach(e=>e.sets.forEach(fix))); S.templates.forEach(t=>t.entries.forEach(e=>e.sets.forEach(fix)));
  S.profile.bw.forEach(b=>b.w=Math.round(b.w*k*10)/10); S.profile.unit=to;
}
const ACT={
  closeSheet,
  back(d){ if(d.to==='back'){ history.length>1?history.back():go('#/progress/exercises'); } else go(d.to); },
  startThisWeek(){ const w=ensureWeek(mondayOf(today())); save(); go('#/week/'+w.id); },
  newWeek(){ const cur=mondayOf(today()); let st=cur; while(S.weeks.some(w=>w.start===st)) st=addDays(st,7);
    sheet(`<h2>New week</h2><div class="form"><label>Any day in the week<input id="wkDate" type="date" value="${st}"></label><label>Name<input id="wkName" placeholder="Optional, for example Deload"></label>
    <label>Start from<select id="wkSrc"><option value="">An empty week</option>${[...S.weeks].sort((a,b)=>b.start.localeCompare(a.start)).slice(0,8).map(w=>`<option value="${w.id}">Copy ${esc(weekTitle(w))}</option>`).join('')}</select></label></div>
    <div class="actions"><button class="btn solid" data-act="createWeek">Create week</button><button class="btn" data-act="closeSheet">Cancel</button></div>`); },
  createWeek(){ const v=$('#wkDate').value||today(), st=mondayOf(v); if(S.weeks.some(w=>w.start===st)){ const w=S.weeks.find(w=>w.start===st); closeSheet(); toast('That week already exists'); return go('#/week/'+w.id); }
    const w=ensureWeek(st); w.name=$('#wkName').value.trim(); const src=weekOf($('#wkSrc').value); if(src) copyWeekInto(src,w); save(); closeSheet(); go('#/week/'+w.id); },
  copyWeek(d){ const src=weekOf(d.id); let st=addDays(src.start,7); while(S.weeks.some(w=>w.start===st&&weekWos(w).length)) st=addDays(st,7); const w=ensureWeek(st); copyWeekInto(src,w); save(); toast('Copied to the week of '+fDate(st)); go('#/week/'+w.id); },
  delWeek(d){ if(!d.ok) return confirmSheet('Delete this week and its workouts?','delWeek',{id:d.id},'Delete week'); S.workouts=S.workouts.filter(w=>w.week!==d.id); S.weeks=S.weeks.filter(w=>w.id!==d.id); save(); closeSheet(); go('#/log'); },
  addWo(d){ addWoSheet(d.week,d.date); },
  createWo(d){ const src=$('#nwSrc').value; let entries=[], title=$('#nwTitle').value.trim();
    if(src.startsWith('t:')){ const t=S.templates.find(x=>x.id===src.slice(2)); entries=cloneEntries(t.entries); title=title||t.name; }
    if(src.startsWith('w:')){ const w=woOf(src.slice(2)); entries=cloneEntries(w.entries); title=title||w.title; }
    const wo={id:uid(),week:d.week,date:d.date,title,note:'',entries}; S.workouts.push(wo); save(); closeSheet(); go('#/workout/'+wo.id); },
  delWo(d){ if(!d.ok) return confirmSheet('Delete this workout?','delWo',{wo:d.wo},'Delete workout'); const wo=woOf(d.wo); S.workouts=S.workouts.filter(w=>w.id!==d.wo); save(); closeSheet(); go(wo&&weekOf(wo.week)?'#/week/'+wo.week:'#/log'); },
  moveWo(d){ const wo=woOf(d.wo); sheet(`<h2>Change date</h2><div class="form"><label>Date<input id="mvDate" type="date" value="${wo.date}"></label></div><p class="sub">The workout moves to the week that holds the new date.</p><div class="actions"><button class="btn solid" data-act="doMoveWo" data-wo="${wo.id}">Move workout</button><button class="btn" data-act="closeSheet">Cancel</button></div>`); },
  doMoveWo(d){ const wo=woOf(d.wo), v=$('#mvDate').value; if(v){ wo.date=v; wo.week=ensureWeek(mondayOf(v)).id; save(); } closeSheet(); refresh(); },
  saveTpl(d){ const wo=woOf(d.wo); if(!wo.entries.length) return toast('Add an exercise first'); const name=wo.title||'Workout';
    const ents=wo.entries.filter(e=>EXM[e.ex]).map(e=>({ex:e.ex,sets:blankSets(EXM[e.ex],e.sets)})); const old=S.templates.find(t=>t.name===name); if(old) old.entries=ents; else S.templates.push({id:uid(),name,entries:ents}); save(); toast(old?'Template updated':'Saved as template'); },
  delTpl(d){ S.templates=S.templates.filter(t=>t.id!==d.id); save(); refresh(); },
  pickEx(d){ pickerSheet(d.wo); },
  pickCat(d){ pick.cat=d.cat; pickerList(); },
  chooseEx(d){ const wo=woOf(pick.wo); wo.entries.push(newEntry(d.ex,wo.date,wo.id)); save(); closeSheet(); render(); scrollTo(0,document.body.scrollHeight); },
  newCustom(){ customSheet(); },
  createCustom(){ const name=$('#cxName').value.trim(); if(!name) return toast('Give it a name'); let id='my-'+slug(name); if(EXM[id]) return toast('That exercise already exists');
    const type=$('#cxType').value, ex={id,name,cat:'MY',custom:true,nr:true,type,p:type==='c'?null:($('#cxP').value||null),sec:[]}; if(type==='b'){ex.f=1;ex.elite=1;} if(type==='h') ex.elite=60;
    S.custom.push(ex); rebuildEx(); save(); if(pick.wo&&woOf(pick.wo)&&location.hash.includes('workout')){ ACT.chooseEx({ex:id}); } else { closeSheet(); refresh(); } toast('Exercise created'); },
  addSet(d){ const {en,ex}=findSet({...d,si:0}); const p=en.sets[en.sets.length-1]||{}; en.sets.push({pw:p.w??p.pw,pr:p.r??p.pr,pt:p.t??p.pt,st:p.st}); save(); refresh(); },
  delSet(d){ const {en}=findSet(d); en.sets.splice(+d.si,1); save(); refresh(); },
  fillSet(d){ const {set,ex}=findSet(d); if(isDone(ex,set)) return; if(set.pr==null&&set.pt==null) return toast('Type your numbers for this set'); if(set.w==null&&set.pw!=null) set.w=set.pw; if(set.r==null&&set.pr!=null) set.r=set.pr; if(set.t==null&&set.pt!=null) set.t=set.pt; save(); refresh(); },
  tagSet(d){ const {set}=findSet(d), on=new Set(set.tags||[]); sheet(`<h2>Tags for this set</h2><p class="chips">${S.tags.map(t=>`<button class="chip ${on.has(t)?'on':''}" data-act="toggleTag" data-wo="${d.wo}" data-en="${d.en}" data-si="${d.si}" data-tag="${esc(t)}">${esc(t)}</button>`).join('')}</p><p class="sub">Add or remove tags in Profile.</p><button class="btn solid block" data-act="closeSheet">Done</button>`); },
  toggleTag(d,el){ const {set}=findSet(d); const t=new Set(set.tags||[]); t.has(d.tag)?t.delete(d.tag):t.add(d.tag); set.tags=[...t]; el.classList.toggle('on'); save(); const y=scrollY; render(); scrollTo(0,y); },
  entryMenu(d){ sheet(`<h2>${esc(EXM[findSet({...d,si:0}).en.ex].name)}</h2><div class="menu"><button data-act="moveEn" data-dir="-1" data-wo="${d.wo}" data-en="${d.en}">Move up</button><button data-act="moveEn" data-dir="1" data-wo="${d.wo}" data-en="${d.en}">Move down</button><button data-act="viewEx" data-wo="${d.wo}" data-en="${d.en}">See progress</button><button class="dangertxt" data-act="delEn" data-wo="${d.wo}" data-en="${d.en}">Remove from workout</button></div><button class="btn block" data-act="closeSheet">Cancel</button>`); },
  moveEn(d){ const wo=woOf(d.wo), i=wo.entries.findIndex(e=>e.id===d.en), j=i+ +d.dir; if(j>=0&&j<wo.entries.length){ [wo.entries[i],wo.entries[j]]=[wo.entries[j],wo.entries[i]]; save(); } closeSheet(); refresh(); },
  delEn(d){ const wo=woOf(d.wo); wo.entries=wo.entries.filter(e=>e.id!==d.en); save(); closeSheet(); refresh(); },
  viewEx(d){ const {en}=findSet({...d,si:0}); closeSheet(); go('#/exercise/'+en.ex); },
  howRanks(){ howSheet(); },
  flipBody(d){ bodySide=d.side; refresh(); },
  addBw(){ const v=parseFloat($('#bwIn').value.replace(',','.')), dt=$('#bwDate').value||today(); if(!(v>0)) return toast('Enter your weight'); S.profile.bw=S.profile.bw.filter(b=>b.date!==dt); S.profile.bw.push({date:dt,w:v}); S.profile.bw.sort((a,b)=>a.date.localeCompare(b.date)); save(); refresh(); toast('Weight logged'); },
  delBw(d){ if(S.profile.bw.length<2) return toast('Keep at least one entry'); S.profile.bw=S.profile.bw.filter(b=>b.date!==d.date); save(); refresh(); },
  addTag(){ const v=$('#tagIn').value.trim(); if(v&&!S.tags.includes(v)){ S.tags.push(v); save(); refresh(); } },
  delTag(d){ S.tags.splice(+d.i,1); save(); refresh(); },
  async export(){ S.lastBackup=today(); const name=`kouros-backup-${today()}.json`, blob=new Blob([JSON.stringify(S)],{type:'application/json'});
    try{ const f=new File([blob],name,{type:'application/json'}); if(navigator.canShare&&navigator.canShare({files:[f]})){ await navigator.share({files:[f],title:'Kouros backup'}); save(); return refresh(); } }catch(e){ if(e&&e.name==='AbortError') return; }
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); a.remove(); save(); refresh(); },
  import(){ $('#impFile')?$('#impFile').click():(()=>{ const i=document.createElement('input'); i.type='file'; i.accept='.json,application/json'; i.onchange=()=>readBackup(i.files[0]); i.click(); })(); },
  finishSetup(){ const bw=parseFloat($('#suBw').value.replace(',','.')); if(!(bw>0)) return toast('Enter your bodyweight'); const p=S.profile; p.name=$('#suName').value.trim(); p.sex=$('#suSex').value; p.age=parseInt($('#suAge').value)||null; p.unit=$('#suUnit').value; p.bw=[{date:today(),w:bw}]; save(); closeSheet(); render(); }
};
function copyWeekInto(src,dst){ const shift=Math.round((D(dst.start)-D(src.start))/864e5); weekWos(src).forEach(w=>S.workouts.push({id:uid(),week:dst.id,date:addDays(w.date,shift),title:w.title,note:'',entries:cloneEntries(w.entries)})); }
function readBackup(file){ if(!file) return; const r=new FileReader(); r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!d||!Array.isArray(d.workouts)||!d.profile) throw 0; S=Object.assign(DEFAULT(),d); rebuildEx(); save(); closeSheet(); render(); toast('Backup loaded'); if(needsSetup()) setupSheet(); }catch(e){ toast('That file is not a Kouros backup'); } }; r.readAsText(file); }

document.addEventListener('click',e=>{ const el=e.target.closest('[data-act]'); if(!el) return; const f=ACT[el.dataset.act]; if(f){ e.preventDefault(); f(el.dataset,el); } });
document.addEventListener('change',e=>{ const t=e.target; if(t.id==='impFile') readBackup(t.files[0]); if(t.dataset.actChange==='unit'&&t.value!==unit()){ convertUnits(t.value); save(); refresh(); toast('Converted to '+(t.value==='kg'?'kilograms':'pounds')); } });
document.addEventListener('input',e=>{ const t=e.target, d=t.dataset;
  if(t.id==='pq'){ pick.q=t.value; return pickerList(); }
  if(d.f){ const {set,ex}=findSet(d); if(!set) return;
    if(d.f==='note'){ if(t.value) set.note=t.value; else delete set.note; }
    else if(d.f==='st'||d.f==='int') set[d.f]=+t.value;
    else { const n=parseFloat(t.value.replace(',','.')); if(isNaN(n)||n<0) delete set[d.f]; else set[d.f]=n; }
    const b=t.closest('.set').querySelector('.num'); b.classList.toggle('done',isDone(ex,set)); return save(); }
  if(d.bind){ const p=d.bind.split(':'); let o,k;
    if(p[0]==='wk'){o=weekOf(p[1]);k=p[2];} else if(p[0]==='wo'){o=woOf(p[1]);k=p[2];} else if(p[0]==='en'){o=woOf(p[1]).entries.find(x=>x.id===p[2]);k=p[3];} else {o=S.profile;k=p[1];}
    if(o){ o[k]=d.num?(parseInt(t.value)||null):t.value; save(); if(d.re) refresh(); } }
});
window.addEventListener('hashchange',()=>{ closeSheet(); render(); });

(async function init(){
  try{ S=await dbGet(); }catch(e){ memOnly=true; }
  S=Object.assign(DEFAULT(),S||{}); rebuildEx(); render();
  if(needsSetup()) setupSheet();
  if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(()=>{});
  if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
